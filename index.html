<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финансы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background: #f5f5f5;
        }
        .balance {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin: 30px 0;
            color: #2196F3;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #2196F3;
            color: white;
        }
        button.expense {
            background: #f44336;
        }
        button.sync {
            background: #4CAF50;
            margin-bottom: 10px;
        }
        .history {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }
        .item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .status {
            text-align: center;
            color: #666;
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }
        .sync-status {
            text-align: center;
            color: #4CAF50;
            margin: 5px 0;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="balance" id="balance">0 ₽</div>

    <div class="buttons">
        <button onclick="addMoney()">💰 Доход</button>
        <button class="expense" onclick="spendMoney()">💸 Расход</button>
    </div>

    <button class="sync" onclick="forceSync()">🔄 Принудительная синхронизация</button>
    <div class="sync-status" id="syncStatus"></div>

    <div class="history" id="history"></div>
    <div class="status" id="status">Готов</div>

    <script>
        let tg = Telegram.WebApp;
        tg.expand();

        let balance = 0;
        let transactions = [];
        let userId = tg.initDataUnsafe?.user?.id || 'unknown';
        let syncInProgress = false;

        // Загрузка при старте
        function loadData() {
            let saved = localStorage.getItem('finance_' + userId);
            if (saved) {
                let data = JSON.parse(saved);
                balance = data.balance || 0;
                transactions = data.transactions || [];
                updateUI();
                document.getElementById('status').innerText = '📦 Загружено локально';
            } else {
                // Если нет локальных данных, запрашиваем с сервера
                requestFromServer();
            }
        }

        // Запрос данных с сервера
        function requestFromServer() {
            document.getElementById('syncStatus').innerText = '🔄 Запрос данных...';
            tg.sendData(JSON.stringify({
                action: 'load',
                userId: userId
            }));
        }

        // Отправка данных на сервер
        function sendToServer() {
            if (syncInProgress) return;

            syncInProgress = true;
            document.getElementById('syncStatus').innerText = '🔄 Сохранение...';

            tg.sendData(JSON.stringify({
                action: 'save',
                userId: userId,
                balance: balance,
                transactions: transactions
            }));

            // Таймаут для сброса статуса
            setTimeout(() => {
                syncInProgress = false;
                if (document.getElementById('syncStatus').innerText.includes('🔄')) {
                    document.getElementById('syncStatus').innerText = '';
                }
            }, 2000);
        }

        // Принудительная синхронизация
        function forceSync() {
            requestFromServer();
        }

        // Обновление экрана
        function updateUI() {
            document.getElementById('balance').innerText = balance.toFixed(2) + ' ₽';

            let html = '<h3>История</h3>';
            if (transactions.length === 0) {
                html += '<div class="item">Нет операций</div>';
            } else {
                transactions.slice(-10).reverse().forEach(t => {
                    let sign = t.type === 'income' ? '+' : '-';
                    let color = t.type === 'income' ? '#4CAF50' : '#f44336';
                    html += `<div class="item">
                        <span>${t.desc || 'Операция'}</span>
                        <span style="color: ${color}">${sign}${t.amount} ₽</span>
                    </div>`;
                });
            }
            document.getElementById('history').innerHTML = html;

            // Сохраняем локально
            localStorage.setItem('finance_' + userId, JSON.stringify({
                balance: balance,
                transactions: transactions,
                lastUpdate: Date.now()
            }));
        }

        // Добавить доход
        function addMoney() {
            let amount = prompt('Сумма дохода:', '1000');
            if (amount && !isNaN(amount)) {
                amount = parseFloat(amount);
                balance += amount;
                transactions.push({
                    type: 'income',
                    amount: amount,
                    desc: 'Доход',
                    date: new Date().toISOString()
                });
                updateUI();
                sendToServer();
                document.getElementById('status').innerText = '✅ Добавлено';
            }
        }

        // Добавить расход
        function spendMoney() {
            let amount = prompt('Сумма расхода:', '500');
            if (amount && !isNaN(amount)) {
                amount = parseFloat(amount);
                if (amount > balance) {
                    alert('Недостаточно средств!');
                    return;
                }
                balance -= amount;
                transactions.push({
                    type: 'expense',
                    amount: amount,
                    desc: 'Расход',
                    date: new Date().toISOString()
                });
                updateUI();
                sendToServer();
                document.getElementById('status').innerText = '✅ Списано';
            }
        }

        // Слушаем сообщения от бота
        window.addEventListener('message', (event) => {
            try {
                let data = JSON.parse(event.data);
                console.log('Получено от бота:', data);

                if (data.action === 'sync') {
                    // Получены данные с сервера
                    if (data.balance !== undefined) {
                        balance = data.balance;
                        transactions = data.transactions || [];
                        updateUI();
                        document.getElementById('syncStatus').innerText = '✅ Данные загружены с сервера';
                        document.getElementById('status').innerText = '📦 Серверные данные';

                        setTimeout(() => {
                            document.getElementById('syncStatus').innerText = '';
                        }, 3000);
                    }
                }
            } catch(e) {
                console.log('Ошибка парсинга:', e);
            }
        });

        // Периодическая синхронизация (каждые 10 секунд)
        setInterval(() => {
            if (transactions.length > 0) {
                requestFromServer();
            }
        }, 10000);

        // Старт
        loadData();
    </script>
</body>
</html>
