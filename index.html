<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финансы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background: #f5f5f5;
        }
        .balance {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin: 30px 0;
            color: #2196F3;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #2196F3;
            color: white;
        }
        button.expense {
            background: #f44336;
        }
        .history {
            background: white;
            border-radius: 10px;
            padding: 15px;
        }
        .item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .status {
            text-align: center;
            color: #666;
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="balance" id="balance">0 ₽</div>

    <div class="buttons">
        <button onclick="addMoney()">💰 Доход</button>
        <button class="expense" onclick="spendMoney()">💸 Расход</button>
    </div>

    <div class="history" id="history"></div>
    <div class="status" id="status">Готов</div>

    <script>
        let tg = Telegram.WebApp;
        tg.expand();

        let balance = 0;
        let transactions = [];

        // Загрузка при старте
        async function loadData() {
            let saved = localStorage.getItem('finance');
            if (saved) {
                let data = JSON.parse(saved);
                balance = data.balance || 0;
                transactions = data.transactions || [];
                updateUI();
            }
            // Запрашиваем с сервера
            tg.sendData(JSON.stringify({action: 'load'}));
        }

        // Обновление экрана
        function updateUI() {
            document.getElementById('balance').innerText = balance.toFixed(2) + ' ₽';

            let html = '<h3>История</h3>';
            transactions.slice(-5).reverse().forEach(t => {
                let sign = t.type === 'income' ? '+' : '-';
                let color = t.type === 'income' ? '#4CAF50' : '#f44336';
                html += `<div class="item">
                    <span>${t.desc || 'Операция'}</span>
                    <span style="color: ${color}">${sign}${t.amount} ₽</span>
                </div>`;
            });
            document.getElementById('history').innerHTML = html;

            // Сохраняем
            localStorage.setItem('finance', JSON.stringify({
                balance: balance,
                transactions: transactions
            }));

            // Отправляем на сервер
            tg.sendData(JSON.stringify({
                action: 'save',
                balance: balance,
                transactions: transactions
            }));

            document.getElementById('status').innerText = '✅ Сохранено';
        }

        // Добавить доход
        function addMoney() {
            let amount = prompt('Сумма дохода:');
            if (amount && !isNaN(amount)) {
                amount = parseFloat(amount);
                balance += amount;
                transactions.push({
                    type: 'income',
                    amount: amount,
                    desc: 'Доход',
                    date: new Date().toISOString()
                });
                updateUI();
            }
        }

        // Добавить расход
        function spendMoney() {
            let amount = prompt('Сумма расхода:');
            if (amount && !isNaN(amount)) {
                amount = parseFloat(amount);
                if (amount > balance) {
                    alert('Недостаточно средств!');
                    return;
                }
                balance -= amount;
                transactions.push({
                    type: 'expense',
                    amount: amount,
                    desc: 'Расход',
                    date: new Date().toISOString()
                });
                updateUI();
            }
        }

        // Слушаем ответ от бота
        window.addEventListener('message', (event) => {
            try {
                let data = JSON.parse(event.data);
                if (data.balance !== undefined) {
                    balance = data.balance;
                    transactions = data.transactions || [];
                    updateUI();
                    document.getElementById('status').innerText = '📦 Загружено с сервера';
                }
            } catch(e) {}
        });

        // Старт
        loadData();
    </script>
</body>
</html>
