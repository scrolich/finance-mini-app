<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финансовый трекер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background: #f5f5f5;
        }
        .balance {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin: 30px 0;
            color: #2196F3;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #2196F3;
            color: white;
        }
        button.expense {
            background: #f44336;
        }
        .history {
            background: white;
            border-radius: 10px;
            padding: 15px;
        }
        .item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .status {
            text-align: center;
            color: #666;
            margin: 10px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="balance" id="balance">0 ₽</div>

    <div class="buttons">
        <button onclick="addMoney()">💰 Доход</button>
        <button class="expense" onclick="spendMoney()">💸 Расход</button>
    </div>

    <div class="status" id="status">🔄 Загрузка...</div>

    <div class="history" id="history"></div>

    <script>
        let tg = Telegram.WebApp;
        tg.expand();

        let balance = 0;
        let transactions = [];
        let userId = tg.initDataUnsafe?.user?.id || 0;

        // Загрузка данных при старте
        async function loadData() {
            document.getElementById('status').innerText = '🔄 Загрузка с сервера...';

            // Запрашиваем данные у бота
            tg.sendData(JSON.stringify({
                action: 'load',
                user_id: userId
            }));
        }

        // Обновление экрана
        function updateUI() {
            document.getElementById('balance').innerText = balance.toFixed(2) + ' ₽';

            let html = '<h3>📜 История операций</h3>';
            if (transactions.length === 0) {
                html += '<div class="item">Нет операций</div>';
            } else {
                transactions.slice(-10).reverse().forEach(t => {
                    let sign = t.type === 'income' ? '+' : '-';
                    let color = t.type === 'income' ? '#4CAF50' : '#f44336';
                    let date = new Date(t.date).toLocaleString('ru', {
                        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                    });
                    html += `<div class="item">
                        <span>${t.desc || 'Операция'}</span>
                        <span>
                            <span style="color: ${color}">${sign}${t.amount} ₽</span>
                            <br><small>${date}</small>
                        </span>
                    </div>`;
                });
            }
            document.getElementById('history').innerHTML = html;
        }

        // Сохранение на сервере
        function saveToServer() {
            document.getElementById('status').innerText = '🔄 Сохранение...';

            tg.sendData(JSON.stringify({
                action: 'save',
                user_id: userId,
                balance: balance,
                transactions: transactions
            }));
        }

        // Добавить доход
        function addMoney() {
            let amount = prompt('Сумма дохода:', '1000');
            if (amount && !isNaN(amount)) {
                amount = parseFloat(amount);
                balance += amount;
                transactions.push({
                    type: 'income',
                    amount: amount,
                    desc: 'Доход',
                    date: new Date().toISOString()
                });
                updateUI();
                saveToServer();
            }
        }

        // Добавить расход
        function spendMoney() {
            let amount = prompt('Сумма расхода:', '500');
            if (amount && !isNaN(amount)) {
                amount = parseFloat(amount);
                if (amount > balance) {
                    alert('❌ Недостаточно средств!');
                    return;
                }
                balance -= amount;
                transactions.push({
                    type: 'expense',
                    amount: amount,
                    desc: 'Расход',
                    date: new Date().toISOString()
                });
                updateUI();
                saveToServer();
            }
        }

        // Слушаем ответ от бота
        window.addEventListener('message', (event) => {
            try {
                let data = JSON.parse(event.data);

                if (data.type === 'data_loaded') {
                    // Получены данные с сервера
                    balance = data.balance || 0;
                    transactions = data.transactions || [];
                    updateUI();
                    document.getElementById('status').innerText = '✅ Данные загружены';

                    setTimeout(() => {
                        document.getElementById('status').innerText = '🔄 Готов';
                    }, 2000);

                } else if (data.type === 'data_saved') {
                    // Данные сохранены
                    document.getElementById('status').innerText = '✅ Сохранено';

                    setTimeout(() => {
                        document.getElementById('status').innerText = '🔄 Готов';
                    }, 2000);
                }
            } catch(e) {}
        });

        // Старт
        loadData();
    </script>
</body>
</html>
