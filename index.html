<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финансовый трекер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            padding: 16px;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .balance {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            color: var(--tg-theme-button-color, #40a7e3);
        }
        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        button {
            flex: 1;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            background: var(--tg-theme-button-color, #40a7e3);
            color: var(--tg-theme-button-text-color, #fff);
        }
        button.secondary {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
        }
        button.sync {
            background: #4CAF50;
            margin-top: 10px;
        }
        .form-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--tg-theme-bg-color, #fff);
            padding: 20px;
            z-index: 1000;
            overflow-y: auto;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 12px;
            font-size: 16px;
        }
        .status {
            text-align: center;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="balance" id="balance">0 ₽</div>

        <div class="actions">
            <button onclick="showForm('income')">💰 Доход</button>
            <button class="secondary" onclick="showForm('expense')">💸 Расход</button>
        </div>

        <div class="card">
            <h3>📊 Сегодня</h3>
            <div id="todayStats">Доходы: 0 ₽ | Расходы: 0 ₽</div>
        </div>

        <!-- Кнопка синхронизации -->
        <button class="sync" onclick="syncData()" style="width: 100%;">🔄 Синхронизировать</button>
        <div class="status" id="syncStatus"></div>
    </div>

    <!-- Форма транзакции -->
    <div id="transactionForm" class="form-modal" style="display: none;">
        <h2 id="formTitle">💰 Добавить</h2>

        <div class="form-group">
            <input type="number" id="amount" placeholder="Сумма" step="0.01">
        </div>

        <div class="form-group">
            <select id="category">
                <option value="food">🍔 Еда</option>
                <option value="transport">🚗 Транспорт</option>
                <option value="entertainment">🎮 Развлечения</option>
                <option value="other">💰 Другое</option>
            </select>
        </div>

        <div class="form-group">
            <input type="text" id="description" placeholder="Описание">
        </div>

        <div style="display: flex; gap: 10px;">
            <button onclick="saveTransaction()" style="flex: 2;">✅ Сохранить</button>
            <button onclick="hideForm()" class="secondary" style="flex: 1;">❌</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 0;
        let transactions = [];
        let currentType = 'income';
        let userId = tg.initDataUnsafe?.user?.id || 'unknown';

        function formatMoney(amount) {
            return amount.toFixed(2) + ' ₽';
        }

        function updateUI() {
            document.getElementById('balance').textContent = formatMoney(balance);

            let today = new Date().toDateString();
            let todayIncome = 0;
            let todayExpense = 0;

            transactions.forEach(t => {
                if (new Date(t.date).toDateString() === today) {
                    if (t.type === 'income') todayIncome += t.amount;
                    else todayExpense += t.amount;
                }
            });

            document.getElementById('todayStats').innerHTML =
                `Доходы: ${formatMoney(todayIncome)} | Расходы: ${formatMoney(todayExpense)}`;
        }

        function showForm(type) {
            currentType = type;
            document.getElementById('formTitle').textContent =
                type === 'income' ? '💰 Добавить доход' : '💸 Добавить расход';
            document.getElementById('app').style.display = 'none';
            document.getElementById('transactionForm').style.display = 'block';
        }

        function hideForm() {
            document.getElementById('transactionForm').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('amount').value = '';
        }

        function saveTransaction() {
            let amount = parseFloat(document.getElementById('amount').value);
            let category = document.getElementById('category').value;
            let description = document.getElementById('description').value;

            if (isNaN(amount) || amount <= 0) {
                tg.showAlert('Введите сумму');
                return;
            }

            let transaction = {
                id: Date.now(),
                type: currentType,
                amount: amount,
                category: category,
                description: description,
                date: new Date().toISOString()
            };

            transactions.push(transaction);

            if (currentType === 'income') {
                balance += amount;
            } else {
                balance -= amount;
            }

            // Сохраняем локально
            saveToLocal();

            // Отправляем боту
            sendToBot();

            updateUI();
            hideForm();
            tg.showAlert('✅ Готово!');
        }

        // Сохранение в localStorage
        function saveToLocal() {
            let data = {
                balance: balance,
                transactions: transactions,
                lastSync: new Date().toISOString()
            };
            localStorage.setItem('financeData', JSON.stringify(data));
            document.getElementById('syncStatus').textContent = '📥 Сохранено локально';
        }

        // Отправка данных боту
        function sendToBot() {
            let data = {
                balance: balance,
                transactions: transactions,
                userId: userId
            };

            tg.sendData(JSON.stringify({
                type: 'sync',
                data: data
            }));

            document.getElementById('syncStatus').textContent = '📤 Отправлено в облако';
        }

        // Синхронизация с ботом
        function syncData() {
            document.getElementById('syncStatus').textContent = '🔄 Синхронизация...';

            // Запрашиваем данные у бота
            tg.sendData(JSON.stringify({
                type: 'getData',
                userId: userId
            }));
        }

        // Загрузка данных
        try {
            let saved = localStorage.getItem('financeData');
            if (saved) {
                let data = JSON.parse(saved);
                balance = data.balance || 0;
                transactions = data.transactions || [];
                document.getElementById('syncStatus').textContent = '📦 Загружено локально';
            }
        } catch (e) {
            console.log('Ошибка загрузки');
        }

        updateUI();

        // Получение данных от бота
        window.addEventListener('message', function(event) {
            try {
                let data = JSON.parse(event.data);
                if (data.type === 'sync' && data.data) {
                    balance = data.data.balance || 0;
                    transactions = data.data.transactions || [];
                    saveToLocal();
                    updateUI();
                    document.getElementById('syncStatus').textContent = '✅ Синхронизировано!';
                    tg.showAlert('✅ Данные синхронизированы');
                }
            } catch (e) {}
        });
    </script>
</body>
</html>
