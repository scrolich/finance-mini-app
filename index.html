<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финансовый трекер</title>

    <!-- PWA мета-теги -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Финансы">
    <meta name="theme-color" content="#8b5cf6">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Библиотеки -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Шапка -->
        <div class="header">
            <div class="account-selector">
                <select id="accountSelect" onchange="switchAccount()" class="account-select"></select>
                <button class="btn-icon" onclick="showAccountForm()">➕</button>
            </div>

            <div class="balance-label">Текущий баланс</div>
            <div class="balance" id="balance">0 ₽</div>
            <div class="account-stats" id="accountStats"></div>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-small btn-transfer" onclick="showTransferForm()" style="flex: 1;">🔄 Перевод</button>
            </div>
        </div>

        <!-- Навигация -->
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('main')" id="tab-main">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Главная</span>
            </button>
            <button class="nav-tab" onclick="switchTab('analytics')" id="tab-analytics">
                <span class="nav-icon">📊</span>
                <span class="nav-text">Аналитика</span>
            </button>
            <button class="nav-tab" onclick="switchTab('plans')" id="tab-plans">
                <span class="nav-icon">📋</span>
                <span class="nav-text">Планы</span>
            </button>
        </div>

        <!-- Главная страница -->
        <div id="main-content">
            <div class="actions">
                <button class="btn btn-income" onclick="showForm('income')">
                    <span class="btn-emoji">💰</span> Доход
                </button>
                <button class="btn btn-expense" onclick="showForm('expense')">
                    <span class="btn-emoji">💸</span> Расход
                </button>
            </div>

            <div class="card">
                <div class="card-title">🏦 Все счета</div>
                <div id="accountsSummary" class="accounts-summary"></div>
            </div>

            <div class="card">
                <div class="card-title">📊 Сегодня</div>
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-label">Доходы</div>
                        <div class="stat-value income" id="todayIncome">0 ₽</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Расходы</div>
                        <div class="stat-value expense" id="todayExpense">0 ₽</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">📜 Последние операции</div>
                <div id="history" class="history-list"></div>
            </div>

            <div class="card">
                <div class="card-title">🎯 Бюджет месяца</div>
                <div class="budget-progress">
                    <div class="progress-bar" id="budgetBar" style="width: 0%"></div>
                </div>
                <div class="budget-stats">
                    <span id="spentAmount">0 ₽</span> / <span id="budgetAmount">0 ₽</span>
                </div>
                <button class="btn btn-small" onclick="switchTab('analytics')">Подробнее</button>
            </div>
        </div>

        <!-- Аналитика -->
        <div id="analytics-content" style="display: none;">
            <div class="currency-buttons">
                <button class="currency-btn active-currency" onclick="setCurrency('RUB')" id="currency-rub">🇷🇺 RUB</button>
                <button class="currency-btn" onclick="setCurrency('USD')" id="currency-usd">🇺🇸 USD</button>
                <button class="currency-btn" onclick="setCurrency('EUR')" id="currency-eur">🇪🇺 EUR</button>
            </div>

            <div class="card">
                <div class="card-title">📅 Период</div>
                <div class="period-buttons">
                    <button class="period-btn active" onclick="setPeriod('day')" id="period-day">День</button>
                    <button class="period-btn" onclick="setPeriod('week')" id="period-week">Неделя</button>
                    <button class="period-btn" onclick="setPeriod('month')" id="period-month">Месяц</button>
                    <button class="period-btn" onclick="setPeriod('year')" id="period-year">Год</button>
                    <button class="period-btn" onclick="setPeriod('custom')" id="period-custom">Свой</button>
                </div>
                <div id="customPeriod" style="display: none; margin-top: 10px;">
                    <div style="display: flex; gap: 10px;">
                        <input type="date" id="startDate" class="period-input">
                        <input type="date" id="endDate" class="period-input">
                    </div>
                    <button class="btn btn-small" onclick="applyCustomPeriod()">Применить</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">📊 Распределение расходов</div>
                <div id="chart-categories" style="height: 250px;">
                    <canvas id="categoriesChart"></canvas>
                </div>
            </div>

            <div class="card">
                <div class="card-title">📈 Общая статистика</div>
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-label">Доходы</div>
                        <div class="stat-value income" id="totalIncome">0 ₽</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Расходы</div>
                        <div class="stat-value expense" id="totalExpense">0 ₽</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Баланс</div>
                        <div class="stat-value" id="totalDiff">0 ₽</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <span>🏷️ Мои категории</span>
                    <button class="btn-icon-small" onclick="showCategoryForm()">➕</button>
                </div>
                <div class="category-tabs">
                    <button class="tab-btn" onclick="showCategoryType('income')" id="cat-income-btn">💰 Доходы</button>
                    <button class="tab-btn active" onclick="showCategoryType('expense')" id="cat-expense-btn">💸 Расходы</button>
                </div>
                <div id="incomeCategoriesList" style="display: none;"></div>
                <div id="expenseCategoriesList"></div>
            </div>
        </div>

        <!-- Планы -->
        <div id="plans-content" style="display: none;">
            <div class="card">
                <div class="card-title">
                    <span>📋 Планы расходов</span>
                    <button class="btn-icon-small" onclick="showPlanForm()">➕</button>
                </div>
                <div id="plansList" class="plans-list"></div>
            </div>
        </div>

        <!-- Кнопка сброса -->
        <div class="card" style="margin-top: 20px;">
            <div class="card-title">⚙️ Настройки</div>
            <button class="btn btn-small btn-danger" onclick="resetAllData()">🗑️ Сбросить все данные</button>
        </div>
    </div>

    <!-- КРАСИВАЯ ГЛАВНАЯ КНОПКА -->
    <div class="floating-action">
        <button class="fab" onclick="showQuickActions()">
            <span class="fab-icon">➕</span>
        </button>
    </div>

    <!-- Меню быстрых действий -->
    <div id="quickMenu" class="quick-menu" style="display: none;">
        <div class="quick-menu-overlay" onclick="hideQuickActions()"></div>
        <div class="quick-menu-content">
            <button class="quick-action" onclick="showForm('income'); hideQuickActions()">
                <span class="quick-icon">💰</span>
                <span class="quick-text">Доход</span>
            </button>
            <button class="quick-action" onclick="showForm('expense'); hideQuickActions()">
                <span class="quick-icon">💸</span>
                <span class="quick-text">Расход</span>
            </button>
            <button class="quick-action" onclick="showTransferForm(); hideQuickActions()">
                <span class="quick-icon">🔄</span>
                <span class="quick-text">Перевод</span>
            </button>
            <button class="quick-action" onclick="showPlanForm(); hideQuickActions()">
                <span class="quick-icon">📋</span>
                <span class="quick-text">Новый план</span>
            </button>
            <button class="quick-action" onclick="showAccountForm(); hideQuickActions()">
                <span class="quick-icon">🏦</span>
                <span class="quick-text">Новый счет</span>
            </button>
        </div>
    </div>

    <!-- Формы (оставляем как есть) -->
    <div id="transactionForm" class="form-modal" style="display: none;">...</div>
    <div id="accountForm" class="form-modal" style="display: none;">...</div>
    <div id="transferForm" class="form-modal" style="display: none;">...</div>
    <div id="categoryForm" class="form-modal" style="display: none;">...</div>
    <div id="planForm" class="form-modal" style="display: none;">...</div>
    <div id="budgetForm" class="form-modal" style="display: none;">...</div>
    <div id="initialBalanceModal" class="initial-balance-modal" style="display: none;">...</div>

    <script src="script.js"></script>
</body>
</html>
